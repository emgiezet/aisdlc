openapi: 3.1.0
info:
  title: Sandbox Ledger API
  version: 1.0.0
  description: Customer ledger accounts. All monetary amounts are integer minor units (cents).
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                required: [status]
  /v1/accounts/{id}:
    get:
      operationId: getAccount
      summary: Account details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^acc-[0-9]+$'
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        "404":
          description: No account with that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        currency:
          type: string
      required: [id, name, currency]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]
