target-version = "py312"
line-length = 100
extend-exclude = ["migrations", ".venv", "build", "dist"]

[lint]
select = [
  "F", "E4", "E7", "E9",
  "B",
  "S",
  "ASYNC",
  "PERF",
  "UP",
  "SIM",
  "C4",
  "DTZ",
  "BLE",
  "T20",
  "PL",
  "C90",
  "RUF",
]
ignore = [
  "PLR0913",
  "PLR2004",
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004"]
"**/conftest.py" = ["S101"]

[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-branches = 12
max-returns = 6
max-statements = 50
