name: Release

# Release PRs bump manifests through make; this workflow only tags a validated
# release commit on main. Repository rules forbid direct commits to main.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the tag and creates the GitHub release
    steps:
      # Credentials are required only for the tag and release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify release commit
        id: plan
        run: |
          set -euo pipefail
          # A completed Validate run may already have been overtaken by another merge.
          git fetch origin main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "HEAD is no longer main — leaving release to the newer validation"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject=$(git log -1 --format=%s)
          case "$subject" in
            'chore(release): v'*) ;;
            *)
              echo "HEAD is not a release PR commit — nothing to tag"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          version=$(jq -r .version plugins/sdlc/.claude-plugin/plugin.json)
          # GitHub adds "(#<PR>)" to squash commit subjects by default.
          release_subject="$subject"
          if [[ "$subject" =~ ^(.*)\ \(#[0-9]+\)$ ]]; then
            release_subject="${BASH_REMATCH[1]}"
          fi
          if [ "$release_subject" != "chore(release): v$version" ]; then
            echo "Release commit $subject disagrees with sdlc manifest v$version" >&2
            exit 1
          fi

          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "slopguard_version=$(jq -r .version plugins/slop-guard/.claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "Release PR validated: v$version after ${prev:-the first tag}"
      # Validate the release PR's manifests before the tag exists.
      - name: Version consistency
        if: steps.plan.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for plugin in sdlc slop-guard; do
            p=$(jq -r .version "plugins/$plugin/.claude-plugin/plugin.json")
            m=$(jq -r ".plugins[] | select(.name == \"$plugin\") | .version" .claude-plugin/marketplace.json)
            g=$(jq -r ".plugins[] | select(.name == \"$plugin\") | .version" .grok-plugin/marketplace.json)
            o=$(jq -r ".plugins[] | select(.name == \"$plugin\") | .version" .omp-plugin/marketplace.json)
            k=$(jq -r .version "plugins/$plugin/plugin.json")
            j=$(jq -r .version "plugins/$plugin/package.json")
            [ "$p" = "$m" ] && [ "$p" = "$g" ] && [ "$p" = "$o" ] && [ "$p" = "$k" ] && [ "$p" = "$j" ] \
              || { echo "Version mismatch for $plugin: plugin=$p marketplace=$m grok=$g omp=$o portable=$k package=$j"; exit 1; }
            echo "✓ $plugin $p"
          done

      - name: Tag validated release commit
        if: steps.plan.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] \
            || { echo "main moved before tagging — refusing a stale release" >&2; exit 1; }
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            [ "$(git rev-list -n 1 "v$VERSION")" = "$(git rev-parse HEAD)" ] \
              || { echo "v$VERSION already points at a different commit" >&2; exit 1; }
            echo "v$VERSION already tags this commit"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "refs/tags/v$VERSION"
          fi

      - name: Create the GitHub release
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          SLOPGUARD_VERSION: ${{ steps.plan.outputs.slopguard_version }}
          PREV: ${{ steps.plan.outputs.prev }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists"
            exit 0
          fi
          args=(-f "tag_name=v$VERSION" -f target_commitish=main)
          if [ -n "$PREV" ]; then args+=(-f "previous_tag_name=$PREV"); fi
          notes=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${args[@]}" --jq .body)
          printf '| Plugin | Version |\n|---|---|\n| sdlc | %s |\n| slop-guard | %s |\n\n%s\n' \
            "$VERSION" "$SLOPGUARD_VERSION" "$notes" \
            | gh release create "v$VERSION" --title "v$VERSION" --notes-file -
