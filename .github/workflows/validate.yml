name: Validate

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository, and both of them execute third-party
# artifacts (npm packages, pip wheels, downloaded linter binaries) in the
# workspace — so the token must be read-only and must not be left in .git/config.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Version consistency
        run: |
          for plugin in sdlc slop-guard; do
            P=$(jq -r '.version' "plugins/$plugin/.claude-plugin/plugin.json")
            M=$(jq -r ".plugins[] | select(.name == \"$plugin\") | .version" .claude-plugin/marketplace.json)
            [ "$P" = "$M" ] || (echo "Version mismatch for $plugin: plugin=$P marketplace=$M" && exit 1)
            echo "✓ $plugin $P"
          done

      - name: Skill frontmatter and trigger sets
        run: |
          for f in plugins/sdlc/skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---' || (echo "Missing frontmatter in $f" && exit 1)
            grep -qi 'use when' "$f" || (echo "Description has no 'Use when' sentence: $f" && exit 1)
            echo "✓ $f"
          done
          for f in plugins/sdlc/skills/*/agents/eval-set.json; do
            jq . "$f" > /dev/null || (echo "Invalid JSON: $f" && exit 1)
            bad=$(jq '[.[] | select(.query == null or .should_trigger == null)] | length' "$f")
            [ "$bad" -eq 0 ] || (echo "Missing required fields in $f" && exit 1)
            neg=$(jq '[.[] | select(.should_trigger == false)] | length' "$f")
            [ "$neg" -ge 1 ] || (echo "No negative trigger cases in $f" && exit 1)
            echo "✓ $f"
          done

      - name: Lint shell scripts
        run: |
          shellcheck --version
          shellcheck -S warning \
            plugins/sdlc/hooks/guard \
            plugins/sdlc/hooks/session-start \
            plugins/sdlc/bin/aisdlc \
            evals/harness/run.sh \
            evals/harness/selftest.sh \
            evals/harness/stub-claude

      # No project-specific vocabulary may leak into a framework meant for any repository.
      # The bracket in each word keeps this pattern from matching its own source line.
      - name: Framework stays project-agnostic
        run: |
          if grep -rniE '\b(insl[y]|acme-cor[p])\b' --exclude-dir=.git .; then
            echo "Found project-specific references in a framework meant for any repository"
            exit 1
          fi
          echo "✓ no project-specific references"

      # psalm 6.16.1 refuses to run on the runner's stock PHP 8.3.6: its phar
      # requires ~8.3.16+ plus ext-dom and ext-simplexml, which php-cli omits.
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2.37.2
        with:
          php-version: '8.3'
          extensions: dom, simplexml, mbstring, tokenizer
          coverage: none

      - name: Install pinned Slop Guard tools
        env:
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/slopguard-tools
          CLAUDE_PLUGIN_OPTION_TOOL_SOURCE: plugin-only
        run: |
          php --version
          python3 -m pip install uv==0.11.11
          plugins/slop-guard/bin/slopguard doctor --install

      # Owns the required-file lists and the instruction budgets.
      - name: make validate
        env:
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/slopguard-tools
          CLAUDE_PLUGIN_OPTION_TOOL_SOURCE: plugin-only
        run: make validate

  runner-and-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: evals/fixtures/sandbox/services/ledger/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Runner selftest (stub claude, no API calls)
        run: make selftest

      - name: Sandbox fixture must be green
        working-directory: evals/fixtures/sandbox
        run: make verify

      - name: Scenario specs must be approved and consistent
        run: |
          for d in evals/harness/scenarios/*/; do
            spec="$d/spec.md"
            grep -q '^status: approved' "$spec" || (echo "$spec is not approved" && exit 1)
            grep -qE '^\| UC-[0-9]+ \|' "$spec" || (echo "$spec has no use-case rows" && exit 1)
            t=$(jq -r '.ticket' "$d/scenario.json")
            grep -q "^ticket: $t$" "$spec" || (echo "$spec ticket != scenario.json ($t)" && exit 1)
            echo "✓ $d"
          done
